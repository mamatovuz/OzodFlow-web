name: Generate signing keystore (bir marta)

# BIR MARTA qo'lda ishga tushiring (Actions → bu workflow → Run workflow).
# Barcha ilovalar shu bitta kalit bilan imzolanadi.
# Natija (keystore + parollar + SHA-256) "keystore-secrets" artifact'ida bo'ladi —
# uni yuklab olib, ichidagi qiymatlarni GitHub Secrets va Railway env'ga joylang.
# Kalit hech qachon logga chiqmaydi.

on:
  workflow_dispatch:
    inputs:
      alias:
        description: Kalit aliasi
        required: true
        default: ozodflow

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore
        run: |
          set -e
          ALIAS="${{ github.event.inputs.alias }}"
          STORE_PW=$(openssl rand -hex 24)
          KEY_PW="$STORE_PW"

          keytool -genkeypair \
            -keystore android.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PW" -keypass "$KEY_PW" \
            -dname "CN=OzodFlow, OU=Apps, O=OzodFlow, L=Tashkent, C=UZ"

          BASE64=$(base64 -w0 android.keystore)

          # SHA-256 barmoq izi (bu OMMAVIY — assetlinks.json / ANDROID_CERT_SHA256 uchun)
          SHA256=$(keytool -list -v -keystore android.keystore -alias "$ALIAS" -storepass "$STORE_PW" \
            | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: //' | tr -d ' ')

          # printf (echo emas) — qiymat oxirida yangi qator qolmasin,
          # aks holda secretlarga newline tushib JSON/imzo buziladi.
          mkdir -p out
          printf '%s' "$BASE64" > out/ANDROID_KEYSTORE_B64.txt
          printf '%s' "$ALIAS" > out/ANDROID_KEY_ALIAS.txt
          printf '%s' "$STORE_PW" > out/ANDROID_KEYSTORE_PASSWORD.txt
          printf '%s' "$KEY_PW" > out/ANDROID_KEY_PASSWORD.txt
          printf '%s' "$SHA256" > out/ANDROID_CERT_SHA256.txt

          {
            echo "## ✅ Keystore tayyor"
            echo ""
            echo "**ANDROID_CERT_SHA256** (ommaviy — Railway env + assetlinks uchun):"
            echo ""
            echo '```'
            echo "$SHA256"
            echo '```'
            echo ""
            echo "Qolgan maxfiy qiymatlar **keystore-secrets** artifact ichida."
            echo "Ularni GitHub → Settings → Secrets and variables → Actions ga qo'shing:"
            echo "- ANDROID_KEYSTORE_B64"
            echo "- ANDROID_KEY_ALIAS"
            echo "- ANDROID_KEYSTORE_PASSWORD"
            echo "- ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload secrets artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets
          path: out/
          retention-days: 1
