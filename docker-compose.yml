# ═══════════════════════════════════════════════════════════════════════════
#  OzodFlow — Docker Compose
#
#  Ishga tushirish:
#    cp .env.example .env    # va qiymatlarni to'ldiring
#    docker compose up --build
#
#  MinIO (S3 mos fayl saqlash) ixtiyoriy — `storage` profili bilan:
#    docker compose --profile storage up --build
# ═══════════════════════════════════════════════════════════════════════════

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"

    environment:
      NODE_ENV: production

      # SQLite fayl DOIMIY VOLUME'da turishi shart.
      # Konteyner fayl tizimi vaqtinchalik — volume'siz har restartda
      # barcha ma'lumot yo'qoladi.
      DATABASE_URL: "file:/data/ozodflow.db"

      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET to'ldirilishi shart}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET to'ldirilishi shart}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-30d}

      # Birinchi super admin. Yaratilgandan keyin bu qiymatlarni
      # bo'shatib qo'yish tavsiya etiladi.
      OZODFLOW_ADMIN_EMAIL: ${OZODFLOW_ADMIN_EMAIL:-}
      OZODFLOW_ADMIN_PASSWORD: ${OZODFLOW_ADMIN_PASSWORD:-}
      OZODFLOW_ADMIN_NAME: ${OZODFLOW_ADMIN_NAME:-OzodFlow Admin}

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      TELEGRAM_LOGIN_BOT_USERNAME: ${TELEGRAM_LOGIN_BOT_USERNAME:-}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-OzodFlow <noreply@ozodflow.uz>}

      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-ozodflow}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}

      PLATFORM_COMMISSION_PERCENT: ${PLATFORM_COMMISSION_PERCENT:-15}
      MIN_WITHDRAWAL_AMOUNT: ${MIN_WITHDRAWAL_AMOUNT:-100000}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-UZS}

      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5}

      REDIS_URL: ${REDIS_URL:-}

    volumes:
      # Database. Bu volume o'chirilsa BARCHA ma'lumot yo'qoladi.
      - ozodflow-data:/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Fayl saqlash (ixtiyoriy) ─────────────────────────────────────────────
  # Portfolio, rezyume va chat fayllari uchun S3 mos xotira.
  # Lokal ishlab chiqishda AWS'ga ulanmasdan sinash imkonini beradi.
  minio:
    image: minio/minio:latest
    profiles: ["storage"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-ozodflow}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-ozodflow-local-secret}
    volumes:
      - ozodflow-files:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Redis (ixtiyoriy) ────────────────────────────────────────────────────
  # Rate limiting va sessiya keshi uchun. Bo'lmasa xotirada ishlaydi —
  # bitta instansiya uchun yetarli, bir nechta instansiyada Redis kerak.
  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - ozodflow-redis:/data

volumes:
  ozodflow-data:
  ozodflow-files:
  ozodflow-redis:
