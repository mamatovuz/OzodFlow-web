name: Build restaurant APK

# Restoran mobil ilovasini (imzolangan .apk) quradi.
# OzodFlow serveri "Ilova yaratish" bosilганда bu workflow'ni workflow_dispatch
# orqali ishga tushiradi va tayyor APK ni /api/mobile-app/upload ga qaytaradi.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Restoran slug
        required: true
      appName:
        description: Ilova nomi
        required: true
      packageName:
        description: Android paket nomi (uz.ozodflow.xxx)
        required: true
      themeColor:
        description: Asosiy rang (#RRGGBB)
        required: true
      host:
        description: Domen (ozodflow.uz)
        required: true
      startPath:
        description: Boshlang'ich yo'l (/m/slug?source=app)
        required: true
      iconUrl:
        description: 512px ikonka URL
        required: true
      callbackUrl:
        description: Tayyor APK yuboriladigan manzil
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.25.0

      - name: Point Bubblewrap to preinstalled JDK + SDK
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          { "jdkPath": "${JAVA_HOME}", "androidSdkPath": "${ANDROID_SDK_ROOT}" }
          EOF

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$GITHUB_WORKSPACE/android.keystore"
          test -s "$GITHUB_WORKSPACE/android.keystore"

      - name: Write TWA manifest
        run: |
          cat > "$GITHUB_WORKSPACE/twa-manifest.json" <<EOF
          {
            "packageId": "${{ github.event.inputs.packageName }}",
            "host": "${{ github.event.inputs.host }}",
            "name": "${{ github.event.inputs.appName }}",
            "launcherName": "${{ github.event.inputs.appName }}",
            "display": "standalone",
            "orientation": "portrait",
            "themeColor": "${{ github.event.inputs.themeColor }}",
            "themeColorDark": "${{ github.event.inputs.themeColor }}",
            "navigationColor": "${{ github.event.inputs.themeColor }}",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#00000000",
            "navigationDividerColorDark": "#00000000",
            "backgroundColor": "#ffffff",
            "enableNotifications": false,
            "startUrl": "${{ github.event.inputs.startPath }}",
            "iconUrl": "${{ github.event.inputs.iconUrl }}",
            "maskableIconUrl": "${{ github.event.inputs.iconUrl }}",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "$GITHUB_WORKSPACE/android.keystore",
              "alias": "${{ secrets.ANDROID_KEY_ALIAS }}"
            },
            "appVersionName": "1.0.${{ github.run_number }}",
            "appVersionCode": ${{ github.run_number }},
            "shortcuts": [],
            "generatorApp": "ozodflow",
            "webManifestUrl": "https://${{ github.event.inputs.host }}/m/${{ github.event.inputs.slug }}/manifest.webmanifest",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://${{ github.event.inputs.host }}/m/${{ github.event.inputs.slug }}",
            "minSdkVersion": 21,
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "appVersion": "1.0.${{ github.run_number }}"
          }
          EOF
          cat "$GITHUB_WORKSPACE/twa-manifest.json"

      - name: Build & sign APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p build && cd build
          bubblewrap init --manifest "$GITHUB_WORKSPACE/twa-manifest.json" --directory . --skipPwaValidation
          bubblewrap build --skipPwaValidation

      - name: Locate signed APK
        id: apk
        run: |
          APK=$(find "$GITHUB_WORKSPACE/build" -name "*-release-signed.apk" | head -1)
          if [ -z "$APK" ]; then APK=$(find "$GITHUB_WORKSPACE/build" -name "*.apk" | head -1); fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"

      - name: Send APK back to OzodFlow
        run: |
          curl -sf -X POST \
            -F "file=@${{ steps.apk.outputs.path }}" \
            "${{ github.event.inputs.callbackUrl }}"

      - name: Report failure to OzodFlow
        if: failure()
        run: |
          curl -sf -X POST "${{ github.event.inputs.callbackUrl }}&status=failed" || true
